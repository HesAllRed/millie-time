<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Millie Time — icon maker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  body{ background:#101116; color:#F0E7E1; font-family:system-ui,sans-serif; margin:0; padding:40px 24px 80px; }
  h1{ font-family:"Bricolage Grotesque",sans-serif; font-weight:800; letter-spacing:-.03em; margin:0 0 6px; }
  p{ color:#A9A29E; max-width:62ch; line-height:1.6; margin:0 0 28px; }
  .row{ display:flex; gap:24px; flex-wrap:wrap; align-items:flex-end; }
  .cell{ text-align:center; }
  canvas{ border-radius:18px; display:block; background:#151027; }
  .cell span{ display:block; font-family:ui-monospace,monospace; font-size:11px; color:#6E6A69; margin-top:8px; letter-spacing:.1em; }
  button{ margin-top:28px; background:#D3D3FF; color:#141024; border:2px solid #F0E7E1; box-shadow:5px 5px 0 #F0E7E1;
          font-family:"Bricolage Grotesque",sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
          font-size:16px; padding:15px 26px; border-radius:3px; cursor:pointer; }
  code{ font-family:ui-monospace,monospace; color:#D3D3FF; }
</style>
</head>
<body>

<h1>Millie Time — icon maker</h1>
<p>
  Direction F, the arcade-carpet wordmark. Click the button, save all five files, and drop
  them into <code>public/icons/</code>. Browsers can't write into a folder for you, so this
  is the one manual step in the build. Filenames are already correct — just don't rename them.
</p>

<div class="row" id="previews"></div>
<button id="save">Download all five</button>

<script>
// One drawing routine, expressed on a 94-unit grid so it scales to any size.
// `inset` shrinks the artwork for the maskable variant, whose outer ~10% can be
// cropped away by the launcher.
function draw(ctx, size, inset = 0) {
  const S = size / 94;
  const k = 1 - inset * 2;

  ctx.save();
  ctx.fillStyle = "#151027";
  ctx.fillRect(0, 0, size, size);

  ctx.translate(size * inset, size * inset);
  ctx.scale(k, k);

  const px = (n) => n * S;
  const line = (x1, y1, x2, y2, color, w) => {
    ctx.strokeStyle = color; ctx.lineWidth = px(w); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(px(x1), px(y1)); ctx.lineTo(px(x2), px(y2)); ctx.stroke();
  };
  const tri = (x, y, w, h, color) => {
    ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(px(x), px(y)); ctx.lineTo(px(x + w / 2), px(y + h)); ctx.lineTo(px(x - w / 2), px(y + h));
    ctx.closePath(); ctx.fill();
  };
  const dot = (x, y, r, color) => {
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px(x), px(y), px(r), 0, Math.PI * 2); ctx.fill();
  };
  const diamond = (x, y, r, color) => {
    ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(px(x), px(y - r)); ctx.lineTo(px(x + r), px(y));
    ctx.lineTo(px(x), px(y + r)); ctx.lineTo(px(x - r), px(y));
    ctx.closePath(); ctx.fill();
  };
  const squiggle = (x, y, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = px(3); ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(px(x), px(y));
    ctx.quadraticCurveTo(px(x + 3.5), px(y - 8), px(x + 7), px(y));
    ctx.quadraticCurveTo(px(x + 10.5), px(y + 8), px(x + 14), px(y));
    ctx.stroke();
  };

  // memphis furniture, kept out of the wordmark's band
  squiggle(6, 17, "#4FC3D9");
  squiggle(58, 86, "#E0479E");
  tri(72, 9, 14, 11, "#D3D3FF");
  tri(11, 82, 12, 10, "#4FC3D9");
  dot(86, 38, 3.2, "#D3D3FF");
  dot(8, 46, 2.8, "#E0479E");
  diamond(48, 14, 6, "#4FC3D9");
  diamond(84, 68, 5, "#E0479E");
  line(28, 88, 39, 88, "#D3D3FF", 3);
  line(6, 79, 14, 79, "#D3D3FF", 2.6);

  // the wordmark
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.font = `800 ${px(24)}px "Bricolage Grotesque", sans-serif`;
  ctx.fillStyle = "#F0E7E1";
  ctx.fillText("millie", px(47), px(46));
  ctx.fillStyle = "#D3D3FF";
  ctx.fillText("time", px(47), px(69));

  ctx.restore();
}

const OUTPUTS = [
  { name: "apple-touch-icon.png",   size: 180, inset: 0 },
  { name: "icon-192.png",           size: 192, inset: 0 },
  { name: "icon-512.png",           size: 512, inset: 0 },
  { name: "icon-maskable-512.png",  size: 512, inset: 0.10 },
  { name: "icon-1024.png",          size: 1024, inset: 0 },
];

const previews = document.getElementById("previews");
const canvases = [];

document.fonts.ready.then(() => {
  for (const out of OUTPUTS) {
    const cell = document.createElement("div");
    cell.className = "cell";
    const c = document.createElement("canvas");
    c.width = c.height = out.size;
    c.style.width = c.style.height = Math.min(out.size, 160) + "px";
    draw(c.getContext("2d"), out.size, out.inset);
    const label = document.createElement("span");
    label.textContent = out.name;
    cell.append(c, label);
    previews.append(cell);
    canvases.push({ canvas: c, name: out.name });
  }
});

function blobOf(canvas) {
  return new Promise((res) => canvas.toBlob(res, "image/png"));
}

// Served by tools/icon-server.mjs: POST straight into public/icons/.
// Opened as a plain file: fall back to ordinary downloads.
async function save() {
  const button = document.getElementById("save");
  const viaServer = location.protocol.startsWith("http");
  button.textContent = "Saving…";

  for (const { canvas, name } of canvases) {
    const blob = await blobOf(canvas);
    if (viaServer) {
      await fetch(`/save/${name}`, { method: "POST", body: blob });
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      await new Promise((r) => setTimeout(r, 350));   // Safari drops rapid-fire downloads
      URL.revokeObjectURL(a.href);
    }
  }
  button.textContent = viaServer ? "Saved to public/icons ✓" : "Downloaded ✓";
}

document.getElementById("save").addEventListener("click", save);

// When the server is hosting us there is nothing to decide — just write them.
if (location.protocol.startsWith("http")) {
  document.fonts.ready.then(() => setTimeout(save, 400));
}
</script>
</body>
</html>
